name: Compila Meteo Flaskio APK
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compila APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepara APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Meteo-Flaskio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Meteo-Flaskio-APK
          path: Meteo-Flaskio.apk
          retention-days: 30
